stages:
  - build
  - test
  - stage

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

.gradle:
  image: eclipse-temurin:11-jdk
  before_script:
    - chmod +x gradlew
  cache:
    key: "gradle-$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches
      - .gradle/wrapper

compile:
  extends: .gradle
  stage: build
  script:
    - ./gradlew installDist
  artifacts:
    paths:
      - build/install/
    expire_in: 1 week

tests:
  extends: .gradle
  stage: test
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/*.xml

package-latest:
  image: docker:27
  stage: stage
  needs: [compile, tests]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:latest"
