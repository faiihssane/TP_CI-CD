name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  check-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifier que le tag est sur main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build-release:
    runs-on: ubuntu-latest
    needs: check-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build de zero, sans cache
        run: |
          chmod +x gradlew
          ./gradlew clean build installDist --no-build-cache --rerun-tasks

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: build/install/

  package-release:
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app
          path: build/install/

      - name: Nom de l'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build et push, sans cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          no-cache: true
          pull: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

  release-note:
    runs-on: ubuntu-latest
    needs: package-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Creer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --notes "Version $GITHUB_REF_NAME. Image Docker : $IMAGE:$GITHUB_REF_NAME" \
            --generate-notes
